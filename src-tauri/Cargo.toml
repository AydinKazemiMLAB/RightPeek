[package]
name = "rightpeek"
version = "0.3.0"
description = "Tray app that shows the current text selection in a right-to-left viewer"
authors = ["Aydin Kazemi"]
edition = "2024"
# The app binary; `capture-probe` is a dev-only diagnostic (docs/development.md).
default-run = "rightpeek"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rightpeek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The Tauri bundler ships every binary target, so the probe is only built on
# request: `--features probe`.
[[bin]]
name = "capture-probe"
required-features = ["probe"]

[features]
probe = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
# Command payloads and the settings model (approved by the user, Phase 2).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Arabic presentation forms -> base letters (docs/design.md, Viewer).
unicode-normalization = "0.1"
tauri-plugin-window-state = "2"

# Sign-in entry: the plugin elsewhere; on Windows auto-launch (the plugin's own
# backend) directly, to force a per-user entry (approved by the user).
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-autostart = "2"

# Selection capture: UI Automation, clipboard, SendInput (docs/design.md).
[target.'cfg(windows)'.dependencies]
auto-launch = "0.6"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Selection capture: the PRIMARY selection on X11/Wayland (approved by the user, Phase 5).
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

# Selection capture (Accessibility, Cmd+C fallback) and the Services menu
# provider; the objc2 family Tauri already uses (approved by the user, Phase 6).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSObject", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSPasteboard", "NSPasteboardItem", "NSResponder"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "AXError", "AXUIElement", "HIServices"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
